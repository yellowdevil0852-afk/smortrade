<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smortrade - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">smortrade</div>
        <nav class="sidebar-menu">
            <a href="/" class="menu-item {% if request.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/search" class="menu-item">Stock Search</a>
            <a href="/analytics" class="menu-item">Analytics</a>
            <a href="/news" class="menu-item">News</a>
            <a href="/stock/{{ ticker }}">{{ ticker }}</a>
        </nav>
    </aside>

    <div class="main-container">
        
        <header class="topbar">
            <div class="topbar-actions">
                <span class="user-profile">User Profile</span>
                <button class="btn-logout">Logout</button>
            </div>
        </header>

        <main class="content-body">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
