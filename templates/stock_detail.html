<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ ticker }} Terminal Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ticker-badge { font-size: 2rem; font-weight: 800; color: #6366f1; }
        .live-price { font-size: 2.5rem; font-weight: 700; color: #22c55e; }
        .timeframe-btn { background: #334155; border: none; color: #94a3b8; padding: 8px 16px; margin-left: 6px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .timeframe-btn.active { background: #6366f1; color: white; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .data-table th { color: #94a3b8; font-weight: 500; }
        .chart-wrapper { position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Left Panel: Chart & Core Logic -->
    <div class="card">
        <div class="header-row">
            <div>
                <span class="ticker-badge" id="ticker-display">{{ ticker }}</span>
                <div id="live-price-container" class="live-price">$--.--</div>
            </div>
            <div>
                <button class="timeframe-btn active" onclick="changeTimeframe('1d', this)">1D</button>
                <button class="timeframe-btn" onclick="changeTimeframe('5d', this)">5D</button>
                <button class="timeframe-btn" onclick="changeTimeframe('1mo', this)">1M</button>
                <button class="timeframe-btn" onclick="changeTimeframe('1y', this)">1Y</button>
            </div>
        </div>

        <div class="chart-wrapper">
            <canvas id="stockChart"></canvas>
        </div>
    </div>

    <!-- Right Panel: Real-Time Numeric Matrix -->
    <div class="card">
        <h3>Real-Time Metrics</h3>
        <table class="data-table">
            <tr><th>Metric</th><th>Value</th></tr>
            <tr><td>Open Price</td><td id="stat-open">$--.--</td></tr>
            <tr><td>Period High</td><td id="stat-high" style="color: #22c55e;">$--.--</td></tr>
            <tr><td>Period Low</td><td id="stat-low" style="color: #ef4444;">$--.--</td></tr>
            <tr><td>Last Tracked Volume</td><td id="stat-volume">--</td></tr>
        </table>
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 20px;">* Charts use rolling intervals. 1D ticks are pushed at 1-minute resolutions.</p>
    </div>
</div>

<script>
    const ticker = "{{ ticker }}";
    let currentPeriod = '1d';
    let stockChart;

    // Build Empty Base Chart 
    const ctx = document.getElementById('stockChart').getContext('2d');
    stockChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: `${ticker} Price`, data: [], borderColor: '#6366f1', tension: 0.1, fill: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }, y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } } } }
    });

    // Main Engine to pull timeframe arrays
    async function updateDashboardData(period) {
        try {
            const response = await fetch(`/api/stock/${ticker}/data?period=${period}`);
            const data = await response.json();
            
            if(data.error) return;

            // 1. Update Numeric Targets
            document.getElementById('live-price-container').innerText = `$${data.current_price}`;
            document.getElementById('stat-open').innerText = `$${data.open}`;
            document.getElementById('stat-high').innerText = `$${data.high}`;
            document.getElementById('stat-low').innerText = `$${data.low}`;
            document.getElementById('stat-volume').innerText = data.volumes[data.volumes.length - 1].toLocaleString();

            // 2. Refresh Graphic Data
            stockChart.data.labels = data.labels;
            stockChart.data.datasets[0].data = data.prices;
            stockChart.update();
        } catch (err) {
            console.error("Failed fetching live market payload", err);
        }
    }

    function changeTimeframe(period, buttonElement) {
        currentPeriod = period;
        document.querySelectorAll('.timeframe-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        updateDashboardData(period);
    }

    // Initialize Dashboard
    updateDashboardData(currentPeriod);

    // Heartbeat real-time cycle: Polls every 10 seconds to keep live records crisp
    setInterval(() => {
        updateDashboardData(currentPeriod);
    }, 10000);
</script>
</body>
</html>
